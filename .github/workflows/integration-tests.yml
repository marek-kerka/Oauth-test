name: Integration Tests

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Auth Service dependencies
      run: |
        cd auth-service
        pip install -r requirements.txt

    - name: Install LLM Service dependencies
      run: |
        cd llm-service
        pip install -r requirements.txt

    - name: Install Test dependencies
      run: |
        pip install -r tests/requirements.txt

    - name: Start Auth Service
      run: |
        cd auth-service
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        echo $! > /tmp/auth-service.pid
        sleep 5
      env:
        REDIS_URL: redis://localhost:6379

    - name: Start LLM Service
      run: |
        cd llm-service
        uvicorn app.main:app --host 0.0.0.0 --port 8001 &
        echo $! > /tmp/llm-service.pid
        sleep 5

    - name: Wait for services to be ready
      run: |
        timeout 30 bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'
        timeout 30 bash -c 'until curl -s http://localhost:8001/health > /dev/null; do sleep 1; done'
        echo "✅ All services are ready"

    - name: Run Integration Tests
      run: |
        python tests/integration_test.py
      env:
        AUTH_SERVICE_URL: http://localhost:8000
        LLM_SERVICE_URL: http://localhost:8001
        REDIS_URL: redis://localhost:6379

    - name: Run End-to-End Test
      run: |
        bash tests/e2e_test.sh
      env:
        AUTH_SERVICE_URL: http://localhost:8000
        LLM_SERVICE_URL: http://localhost:8001

    - name: Check Redis data
      run: |
        redis-cli -h localhost KEYS "refresh_token:*" | wc -l
        echo "✅ Redis integration test passed"

    - name: Cleanup
      if: always()
      run: |
        if [ -f /tmp/auth-service.pid ]; then
          kill $(cat /tmp/auth-service.pid) || true
        fi
        if [ -f /tmp/llm-service.pid ]; then
          kill $(cat /tmp/llm-service.pid) || true
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          tests/*.log
          tests/test-report.json
